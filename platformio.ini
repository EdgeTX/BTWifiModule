; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Primary development target.
default_envs = C3SuperMini

; Common configuration for all ESP32 targets (ESP-IDF).
; espressif32@6.10.0 == ESP-IDF v5.4.0 (matches the repo's sdkconfig.* files).
[esp32]
platform = espressif32@6.10.0
framework = espidf
; Drop -Werror=all so warnings do not break the build (the code is kept
; warning-free regardless).
build_unflags = -Werror=all

; ---------------------------------------------------------------------------
; ESP32 (original Pico Kit)
; ---------------------------------------------------------------------------
[env:pico32]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_PICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; Same board with the NimBLE host instead of Bluedroid.
[env:pico32_nimble]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_PICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32 WROOM (Node32s)
; ---------------------------------------------------------------------------
[env:Node32s_Wroom32]
extends = esp32
board = node32s
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DBLUETOOTH=y
    -DCPU_ESP32=y

; ---------------------------------------------------------------------------
; ESP32-C3 DevKitM-1
; ---------------------------------------------------------------------------
[env:C3Mini]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
upload_protocol = esptool
build_type = debug
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3MINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; ---------------------------------------------------------------------------
; Radiomaster Pico
; ---------------------------------------------------------------------------
[env:RM_pico]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RMPICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; Same board with the NimBLE host instead of Bluedroid.
[env:RM_pico_nimble]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RMPICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; RadioMaster Wireless Module (ESP32-D0WDQ6, 8 MB flash, USB-C + CP2102)
; Radio UART on UART0: GPIO1 (TX) -> J4 pin 3 TXD, GPIO3 (RX) <- J4 pin 2 RXD.
; A CH442E mux selected by USB VBUS shares UART0 between the radio bay and the
; CP2102 bridge, so there is no free pin for a log console. The build is silent
; (CONFIG_LOG_DEFAULT_LEVEL_NONE) to keep the AT link clean; raise the log level
; in sdkconfig.RM_Wireless* only while working over USB (radio detached).
; ---------------------------------------------------------------------------
[env:RM_Wireless]
extends = esp32
board = rm_wireless
board_build.partitions = rm_wireless_partitions.csv
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RM_WIRELESS=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; Same board with the NimBLE host instead of Bluedroid.
[env:RM_Wireless_nimble]
extends = esp32
board = rm_wireless
board_build.partitions = rm_wireless_partitions.csv
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RM_WIRELESS=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini (primary target)
; ---------------------------------------------------------------------------
[env:C3SuperMini]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = sdkconfig.C3SuperMini
upload_protocol = esptool
; The ESP32-C3 SuperMini's native USB (USB Serial JTAG) does not support the
; DTR/RTS reset sequence (board_upload.before_reset = usb_reset) and its stub
; fails on some revisions (--no-stub). After flashing, press RESET (or re-plug
; the USB) to run the app, since after_reset is set to no_reset.
board_upload.before_reset = usb_reset
board_upload.after_reset = no_reset
upload_flags =
    --no-stub
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; Debug build of C3SuperMini: waits 2 s at boot so the host can attach to the
; USB console before the first log (otherwise boot logs can block the app).
[env:C3SuperMini_debug]
extends = env:C3SuperMini
build_flags =
    ${env:C3SuperMini.build_flags}
    -DBOOT_DEBUG_DELAY_MS=2000

; NimBLE experimental build (same board, NimBLE host instead of Bluedroid).
[env:C3SuperMini_nimble]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = sdkconfig.C3SuperMini_nimble
upload_protocol = esptool
; Same native-USB flash settings as C3SuperMini (see note there).
board_upload.before_reset = usb_reset
board_upload.after_reset = no_reset
upload_flags =
    --no-stub
build_type = debug
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32-S3 SuperMini (reference target, not hardware-validated)
; Radio UART on GPIO43 (TX) / GPIO44 (RX); logs on native USB Serial/JTAG.
; Flashes over the native USB port; if auto-reset fails, hold BOOT and tap
; RESET before uploading.
; ---------------------------------------------------------------------------
[env:ESP32S3SuperMini]
extends = esp32
board = esp32_s3_supermini
board_build.esp-idf.sdkconfig_path = sdkconfig.ESP32S3SuperMini
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_S3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; Same board with the NimBLE host instead of Bluedroid.
[env:ESP32S3SuperMini_nimble]
extends = esp32
board = esp32_s3_supermini
board_build.esp-idf.sdkconfig_path = sdkconfig.ESP32S3SuperMini_nimble
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_S3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32-DEV-38P (ESP32 DevKit, 38 pins) — Bluedroid
; Radio UART on GPIO18 (TX) / GPIO19 (RX); logs on UART0.
; ---------------------------------------------------------------------------
[env:ESP32_DEV38P]
extends = esp32
board = esp32_dev_38p
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; Same board with the NimBLE host instead of Bluedroid.
[env:ESP32_DEV38P_nimble]
extends = esp32
board = esp32_dev_38p
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; Host unit tests. Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
