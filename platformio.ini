; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Primary development target.
default_envs = RM_pico

; Common configuration for all ESP32 targets (ESP-IDF).
; espressif32@6.10.0 == ESP-IDF v5.4.0 (matches the repo's sdkconfig.* files).
[esp32]
platform = espressif32@6.10.0
framework = espidf
; Drop -Werror=all so warnings do not break the build (the code is kept
; warning-free regardless).
build_unflags = -Werror=all

; ---------------------------------------------------------------------------
; ESP32 (original Pico Kit)
; ---------------------------------------------------------------------------
[env:pico32]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_PICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; Same board with the NimBLE host instead of Bluedroid.
[env:pico32_nimble]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_PICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32 WROOM (Node32s)
; ---------------------------------------------------------------------------
[env:Node32s_Wroom32]
extends = esp32
board = node32s
upload_protocol = esptool
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DBLUETOOTH=y
    -DCPU_ESP32=y

; ---------------------------------------------------------------------------
; ESP32-C3 DevKitM-1
; ---------------------------------------------------------------------------
[env:C3Mini]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
upload_protocol = esptool
build_type = debug
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3MINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; ---------------------------------------------------------------------------
; Radiomaster Pico
; ---------------------------------------------------------------------------
[env:RM_pico]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RMPICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; A2DP test build: stream a local tone without radio PCM input.
[env:RM_pico_a2dp_test]
extends = env:RM_pico
board_build.esp-idf.sdkconfig_path = sdkconfig.RM_pico
build_flags =
    ${env:RM_pico.build_flags}
    -DA2DP_TEST_TONE

; Same board with the NimBLE host instead of Bluedroid.
[env:RM_pico_nimble]
extends = esp32
board = pico32_cust
upload_protocol = esptool
monitor_speed = 115200
build_type = release
board_build.partitions = pico_partitions.csv
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_RMPICO=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini (primary target)
; ---------------------------------------------------------------------------
[env:C3SuperMini]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = sdkconfig.C3SuperMini
upload_protocol = esptool
; The ESP32-C3 SuperMini's native USB (USB Serial JTAG) does not support the
; DTR/RTS reset sequence (board_upload.before_reset = usb_reset) and its stub
; fails on some revisions (--no-stub). After flashing, press RESET (or re-plug
; the USB) to run the app, since after_reset is set to no_reset.
board_upload.before_reset = usb_reset
board_upload.after_reset = no_reset
upload_flags =
    --no-stub
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y

; NimBLE experimental build (same board, NimBLE host instead of Bluedroid).
[env:C3SuperMini_nimble]
extends = esp32
board_build.flash_mode: dio
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = sdkconfig.C3SuperMini_nimble
upload_protocol = esptool
; Same native-USB flash settings as C3SuperMini (see note there).
board_upload.before_reset = usb_reset
board_upload.after_reset = no_reset
upload_flags =
    --no-stub
build_type = debug
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_C3SUPERMINI=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DBLUETOOTH5=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; ESP32-DEV-38P (ESP32 DevKit, 38 pins) — Bluedroid
; Radio UART on GPIO18 (TX) / GPIO19 (RX); logs on UART0.
; ---------------------------------------------------------------------------
[env:ESP32_DEV38P]
extends = esp32
board = esp32_dev_38p
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y

; Same board with the NimBLE host instead of Bluedroid.
[env:ESP32_DEV38P_nimble]
extends = esp32
board = esp32_dev_38p
upload_protocol = esptool
build_type = release
monitor_speed = 115200
build_flags =
    -DRTOS_FREERTOS=y
    -DPCB_WROOM=y
    -DCPU_ESP32=y
    -DBLUETOOTH=y
    -DUSE_NIMBLE=y

; ---------------------------------------------------------------------------
; Host unit tests. Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
