name: Web Flasher

on:
  push:
    branches: [main, develop]
    paths:
      - 'webflash/**'
      - 'src/**'
      - 'platformio.ini'
      - 'sdkconfig.*'
      - 'boards/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware (all board/host combinations)
        run: |
          pio run -e C3SuperMini -e C3SuperMini_nimble \
                  -e ESP32_DEV38P -e ESP32_DEV38P_nimble \
                  -e ESP32S3SuperMini -e ESP32S3SuperMini_nimble \
                  -e RM_pico -e RM_pico_nimble \
                  -e RM_Wireless -e RM_Wireless_nimble \
                  -e pico32 -e pico32_nimble

      - name: Assemble web flasher
        run: |
          set -eu
          place() { # <env> <board> <host>
            dest="webflash/firmware/$2/$3"
            mkdir -p "$dest"
            cp ".pio/build/$1/bootloader.bin" ".pio/build/$1/partitions.bin" \
               ".pio/build/$1/firmware.bin" "$dest/"
          }
          place C3SuperMini          c3supermini bluedroid
          place C3SuperMini_nimble   c3supermini nimble
          place ESP32_DEV38P         esp32dev38p bluedroid
          place ESP32_DEV38P_nimble  esp32dev38p nimble
          place ESP32S3SuperMini     esp32s3supermini bluedroid
          place ESP32S3SuperMini_nimble esp32s3supermini nimble
          place RM_pico              rmpico      bluedroid
          place RM_pico_nimble       rmpico      nimble
          place RM_Wireless          rmwireless  bluedroid
          place RM_Wireless_nimble   rmwireless  nimble
          place pico32               pico32      bluedroid
          place pico32_nimble        pico32      nimble

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webflash

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
